<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Allianz Wasserstraße e.V.</title>
<style>
  @font-face { font-family: "Fredoka"; font-weight: 500; font-display: swap;
    src: url("fonts/fredoka-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap;
    src: url("fonts/inter-latin-opsz-normal.woff2") format("woff2"); }

  :root { --purple: #7E1889; --blue: #1B42CC; --black: #000; --white: #fff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--white); }
  body {
    display: flex; flex-direction: column;
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; color: var(--black);
  }

  header { display: flex; justify-content: flex-end; padding: 50px 60px 38px; }
  header img { display: block; width: 317px; height: auto; }

  main {
    flex: 1; display: flex; align-items: center;
    padding: 60px 66px;
    background: url("assets/hero.jpg") center 60% / cover no-repeat;
  }
  .card { background: var(--white); padding: 48px 56px; max-width: 640px; }
  h1 { font-family: "Fredoka", sans-serif; font-weight: 500;
    font-size: 72px; line-height: 1; color: var(--purple); }
  .card p { margin-top: 20px; font-size: 20px; line-height: 27px; font-weight: 500; color: var(--purple); }

  footer { display: flex; justify-content: flex-end; padding: 24px 60px;
    font-size: 12px; line-height: 14.4px; color: var(--blue); text-align: right; }
  footer strong { font-weight: 600; }

  @media (max-width: 900px) {
    header { justify-content: flex-start; padding: 24px 16px; }
    header img { width: 220px; }
    main { padding: 32px 16px; }
    .card { padding: 28px 24px; }
    h1 { font-size: 44px; }
    .card p { font-size: 17px; line-height: 25px; }
    footer { justify-content: flex-start; text-align: left; padding: 20px 16px; }
  }
</style>
</head>
<body>
  <header>
    <img src="assets/logo.png" alt="Allianz Wasserstraße – Damit Deutschland in Fluss bleibt." width="317" height="98">
  </header>
  <main>
    <div class="card">
      <h1>Coming soon</h1>
      <p>Unsere Website ist bald für Sie da.</p>
    </div>
  </main>
  <footer>
    <address style="font-style:normal">
      <strong>Allianz Wasserstraße e.V.</strong><br>
      Reinhardstraße 55, R 5212, 10117 Berlin
    </address>
  </footer>
</body>
</html>
